name: Atualizar estatísticas do perfil
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, ~06:17 em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stats.py", ".github/workflows/stats.yml"]
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/stats.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --cached --quiet || (git commit -m "Atualiza estatísticas" && git push)
